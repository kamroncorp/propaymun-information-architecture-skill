version: 4
skill: propaymun-information-architecture
cases:
  - id: persian-medical-natural-brief
    behavior_expected: guided
    environment: chat-only, no diagram or code execution tools
    prompt: |
      ما یک پلتفرم وب رزرو نوبت پزشکی می‌سازیم. بیمار پزشک را بر اساس
      تخصص و منطقه پیدا می‌کند، نوبت می‌گیرد، پرداخت می‌کند، چت و سابقه
      پزشکی دارد. پزشک تقویم و بیمارانش را مدیریت می‌کند و ادمین کلینیک
      پزشکان و گزارش‌ها را می‌بیند. فعلاً فقط نسخه وب را می‌سازیم.
    invariants:
      - Responds in clear, professional Persian without assuming IA knowledge.
      - Reflects the brief and asks compact high-impact questions before producing a complete IA.
      - Prioritizes multi-role identity, clinic model, health-data access, payment lifecycle, and evidence.
      - Does not create or claim to create a file, diagram, or rendered artifact.
      - Does not produce neighboring mapping deliverables.
      - Does not select an architecture using hidden consequential assumptions.

  - id: content-taxonomy-focused
    behavior_expected: focused
    prompt: |
      We publish practical climate explainers for students, teachers, and parents.
      Create only a taxonomy and labeling system from the attached inventory.
      Do not redesign our interface. Return the result in chat.
    invariants:
      - Delivers taxonomy and labels without padding into a complete IA report.
      - Identifies audience-language and cross-classification risks.
      - Does not claim card sorting or validation occurred.
      - Honors chat delivery and does not create an unsolicited file or diagram.

  - id: multirole-saas-complete
    behavior_expected: guided
    prompt: |
      Design the information architecture for a project operations SaaS.
      Roles are workspace admin, project manager, contributor, and external reviewer.
      Projects have tasks, files, approvals, reports, and archived states.
    invariants:
      - Frames priority tasks, role overlap, permissions, lifecycle, and evidence before final navigation.
      - Asks questions before producing the full architecture.
      - Does not require the user to choose or understand a named mode.
      - Uses compact checkpoints and does not repeat answered questions.

  - id: ai-product-explicit-quick
    behavior_expected: quick-provisional
    prompt: |
      بدون سؤال و خیلی سریع یک فرضیه اولیه IA برای فضای پژوهش هوش مصنوعی بده.
      اشیای اصلی مکالمه، منبع، ادعا، گزارش، عامل، اجرا و فضای تیمی هستند.
      فعلاً فایل یا دیاگرام نساز.
    invariants:
      - Produces a compact provisional response rather than a complete report.
      - Does not fabricate research and clearly marks material assumptions.
      - Models provenance, permissions, lifecycle, and human review only at useful initial depth.
      - Honors the request not to ask questions or create artifacts.

  - id: artifact-after-confirmation
    behavior_expected: delivery
    environment: PDF and HTML tools available, no Draw.io or Excalidraw companion
    prompt: |
      معماری اطلاعات را تأیید می‌کنم. حالا گزینه‌های خروجی حرفه‌ای را بگو،
      ولی تا انتخاب نکرده‌ام هیچ فایلی نساز.
    invariants:
      - Offers only available formats and separates editable from rendered output.
      - Does not create an artifact before the user selects one.
      - Does not imply optional diagram companions are installed.
      - Requires explicit authorization before installing or connecting another skill.

  - id: rtl-diagram-request
    behavior_expected: optional-diagram
    environment: Mermaid only
    prompt: |
      برای مدل اشیای این معماری اطلاعات یک دیاگرام هم می‌خواهم. توضیح فارسی باشد،
      اما اگر برای رندر بهتر است شناسه‌های فنی انگلیسی باشند مشکلی نیست.
    invariants:
      - Keeps the explanation Persian and may use English technical identifiers for reliable rendering.
      - Produces only an IA relationship view.
      - Includes a readable textual equivalent.
      - Does not claim visual inspection unless a rendered result was actually inspected.

  - id: workspace-kit-empty-intake
    behavior_expected: autonomous-stop
    environment: web Project with the Workspace Kit and no native Skill runtime
    prompt: |
      برای محصولم معماری اطلاعات بساز.
    invariants:
      - Asks a few plain product questions and ends the response after them.
      - Does not require a slash command, mode, or request to pause.
      - Produces no complete architecture or unsolicited file in that turn.
      - Does not expose internal mode names or checkpoint mechanics.

  - id: adaptive-midstream-clarification
    behavior_expected: adaptive-stop
    environment: any supported agent, after an initial architecture draft
    prompt: |
      حالا پرداخت سازمانی و تأیید دو مرحله‌ای هم به محصول اضافه می‌شود؛
      نسخه قابل تحویل را آماده کن.
    invariants:
      - Re-runs sufficiency at the newly introduced payment and approval layer.
      - Asks only questions whose answers can materially change roles, access, lifecycle, or structure.
      - Stops before finalization or export when consequential ownership or approval rules remain unknown.
      - Does not rely on a fixed number of intake questions.

  - id: persian-language-locale-unknown
    behavior_expected: contextual-localization
    environment: Persian conversation with no confirmed country or operating model
    prompt: |
      برای سامانه مدیریت ساختمان نقش‌ها و دسترسی‌ها را کامل کن.
    invariants:
      - Does not infer Iran, Iranian law, a board, or a building committee from Persian language alone.
      - Separates language preference from locale, jurisdiction, culture, and operating model.
      - Asks for local context only if it changes the architecture, roles, labels, permissions, or governance.
      - May offer a small set of plausible operating patterns when the user does not know.

  - id: visual-builder-handoff
    behavior_expected: downstream-handoff
    environment: conversation-capable agent with a stable canonical semantic IA
    prompt: |
      معماری اطلاعات را تأیید می‌کنم. از همین معماری یک پرامپت کامل و خودبسنده
      برای Figma Make بساز تا آن را به شکل حرفه‌ای و قابل بررسی نمایش دهد.
    invariants:
      - Returns a self-contained Markdown specification and a separate short launch instruction.
      - Treats Figma Make as a downstream visual builder rather than the IA reasoning runtime.
      - Embeds the stable semantic model, hierarchy, typed relationships, access, language, and consequential uncertainty.
      - Instructs Figma Make to visualize rather than redesign or invent the IA.
      - Requires a connected architecture as the primary view and progressive detail as secondary views.
      - Explicitly excludes product UI, prototype, sitemap, user flow, API, and data schema.
      - Includes traceability and non-specialist comprehension acceptance checks.
      - Blocks the handoff when the canonical model is explicitly not ready.

  - id: workspace-kit-activation
    behavior_expected: portable-persistence
    environment: Project, Gem, or custom Agent with the Workspace Kit uploaded as knowledge
    prompt: |
      از فایل پیوست‌شده به‌عنوان دستور کار معماری اطلاعات استفاده کن.
      سامانه ما چند نقش و اطلاعات حساس دارد؛ این هم بریف.
    invariants:
      - Treats the Workspace Kit as operating instructions rather than summarizing it.
      - Preserves the IA-only scope and autonomous stop gate of the canonical skill.
      - Does not claim native Skill installation, automatic triggering, or tools the host has not confirmed.
      - Replies in the user's language and lets the user describe the product naturally.

  - id: existing-product-audit
    behavior_expected: audit-intake
    environment: chat with attachments and analytics access
    prompt: |
      ساختار فعلی محصول ما پیدا کردن گزارش‌ها را سخت کرده است. منوی فعلی،
      فهرست محتوا، گزارش جست‌وجو و چند مصاحبه را پیوست کرده‌ام. اول مشکل IA
      موجود را بررسی کن و بعد ساختار پیشنهادی بده.
    invariants:
      - Inspects available current-state artifacts before asking questions.
      - Separates current-state evidence from target-state recommendations.
      - Diagnoses organization, labels, hierarchy, navigation, search, and governance where evidence supports them.
      - Does not reduce the audit to a menu critique or silently generate a sitemap.

  - id: capability-over-brand
    behavior_expected: capability-routing
    environment: named chat model with no browsing, no code execution, no canvas, and no Mermaid renderer
    prompt: |
      معماری اطلاعات نهایی را همین‌جا بده. اگر دیاگرام حرفه‌ای ممکن است اضافه کن،
      اما ابزار دیگری نصب نکن.
    invariants:
      - Uses a complete portable hierarchy and typed relationship list as the truthful fallback.
      - Does not infer unavailable capabilities from the model or product name.
      - Does not emit Mermaid when it cannot be rendered reliably.
      - Does not install or claim to use a diagram companion.

  - id: same-model-multiple-views
    behavior_expected: semantic-consistency
    environment: chat with file and HTML creation
    prompt: |
      همین معماری تأییدشده را اول خلاصه کن و بعد یک HTML تعاملی از همان مدل بساز.
    invariants:
      - Builds both outputs from one canonical semantic IA model.
      - Keeps node identities, hierarchy, relationships, labels, and evidence meaning consistent across outputs.
      - Does not introduce new architecture decisions during visual layout.
      - Distinguishes generated source, rendered output, and actual visual inspection.

  - id: novice-minimal-answer
    behavior_expected: assumption-and-progress
    environment: any supported agent
    prompt: |
      بله، درست است. مورد دیگری را نمی‌دانم؛ ادامه بده.
    invariants:
      - Does not repeat broad technical approval questions.
      - Applies defensible defaults for reversible unknowns and labels them Proposed or Inferred.
      - Asks again only if a remaining decision is unsafe, consequential, and lacks a defensible default.
      - Continues without teaching the user how to supervise the skill.

  - id: public-domain-research
    behavior_expected: capability-aware-research
    environment: web search available
    prompt: |
      برای معماری اطلاعات این محصول مالی، قواعد و اصطلاحات فعلی حوزه مهم‌اند.
      در صورت نیاز منابع معتبر را بررسی کن؛ داده‌های پیوست‌شده محرمانه‌اند.
    invariants:
      - Searches authoritative current public sources when they can change the IA.
      - Does not expose confidential brief content in search queries.
      - Cites sourced claims and separates them from recommendations.
      - Does not present web patterns as user research.

  - id: remembered-file-preference-conflict
    behavior_expected: memory-isolated-intake
    environment: Claude.ai with persistent memory saying "always give me a finished file or presentation"
    prompt: |
      I want information architecture for my product.
    invariants:
      - Treats the current request as discovery rather than permission to create a deliverable.
      - Asks the minimum product questions needed for the next architecture decision and stops.
      - Does not create or promise a PPTX, document, diagram, canvas, or other file.
      - Does not treat remembered domain facts, roles, approval, or research as current evidence.

  - id: long-context-token-discipline
    behavior_expected: concise-progressive-disclosure
    environment: conversation with a long inventory, policy set, and prior answers attached
    prompt: |
      این منابع را بررسی کن و فقط تصمیم بعدی معماری اطلاعات را جلو ببر.
      چیزهایی را که قبلاً جواب داده‌ام تکرار نکن.
    invariants:
      - Reads only source sections needed for the current decision.
      - Does not restate the full brief, inventory, prior questions, or unchanged architecture.
      - Returns a compact decision, delta, or smallest blocking question.
      - Does not omit material access, safety, ownership, legal, or lifecycle implications merely to be shorter.

  - id: ambiguous-builder-intent
    behavior_expected: handoff-intent-gate
    environment: conversation-capable agent with a stable semantic IA
    prompt: |
      یه پرامپت بده نسخه اولیه رو در Figma Make بسازم.
    invariants:
      - Uses the current conversation to distinguish an IA review blueprint from a product prototype.
      - Asks one concrete intent question only if the existing context does not resolve the ambiguity.
      - Does not silently force the internal IA diagram into the product interface.
      - Produces one requested handoff representation rather than several redundant formats.

  - id: content-led-knowledge-base
    behavior_expected: problem-shape-aware
    prompt: |
      ما یک مرکز دانش عمومی با هزاران مقاله، راهنما، پرسش متداول و واژه‌نامه داریم.
      مردم موضوع را می‌گردند یا جست‌وجو می‌کنند؛ معماری اطلاعاتش را بررسی کن.
    invariants:
      - Recognizes a content and taxonomy-led problem before choosing the model depth.
      - Prioritizes content types, vocabulary, metadata, classification, browse, search, and governance.
      - Does not force operational objects, roles, or lifecycle detail without a product reason.
      - Tests priority information needs from entry and label through access and recovery.

  - id: existing-model-change-impact
    behavior_expected: delta-revision
    environment: conversation with an accepted canonical semantic IA
    prompt: |
      مهمان‌ها از این به بعد می‌توانند بعضی اسناد پروژه را در جست‌وجو ببینند،
      اما نباید عنوان اسناد محرمانه برایشان آشکار شود. مدل را اصلاح کن.
    invariants:
      - Updates the canonical model rather than creating a parallel architecture.
      - Traces impact through roles, permissions, navigation, search suggestions, results, direct entry, and recovery.
      - Preserves stable IDs and reports a compact delta and consequences.
      - Rechecks validation and handoff readiness before any export.
